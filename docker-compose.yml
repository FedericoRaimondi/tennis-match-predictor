services:
  api:
    build:
      context: .
      target: api
    container_name: tennis-predictor-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./config:/app/config:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  streamlit:
    build:
      context: .
      target: streamlit
    container_name: tennis-predictor-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  dev:
    build:
      context: .
      target: dev
    container_name: tennis-predictor-dev
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    command: /bin/bash

networks:
  default:
    name: tennis-predictor-network
