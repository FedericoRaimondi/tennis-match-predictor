[project]
name = "match-predictor"
version = "0.1.0"
description = "Tennis match predictor app"
readme = "README.md"
authors = [
    {name = "Federico Raimondi Cominesi", email = "federico.raimondi@gsom.polimi.it"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "matplotlib>=3.10.3",
    "mlflow==3.1.4",
    "numpy==2.2.5",
    "pandas==2.2.3",
    "requests==2.32.3",
    "scikit-learn==1.6.1",
    "xgboost==3.0.2",
    "loguru==0.7.0",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
]

[project.scripts]
main = 'match_predictor.main:main'

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--verbosity=2 --cov=match_predictor --cov-report html"
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
    "D",  # pydocstyle rules
]

ignore = [
    "E501",  # line-too-long
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google style docstrings

[tool.ruff.format]
indent-style = "space"
