name: Training Pipeline

# This workflow is PAUSED - uncomment 'on' section to enable
# on:
#   schedule:
#     # Run monthly on the 1st at 00:00 UTC
#     - cron: '0 0 1 * *'
#   workflow_dispatch:
#     inputs:
#       tune_hyperparameters:
#         description: 'Perform hyperparameter tuning'
#         required: false
#         default: 'false'
#         type: boolean

on:
  workflow_dispatch:  # Manual trigger only for now
    inputs:
      tune_hyperparameters:
        description: 'Perform hyperparameter tuning'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-new-data:
    runs-on: ubuntu-latest
    outputs:
      should_train: ${{ steps.check.outputs.should_train }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync

      - name: Check for new data
        id: check
        run: |
          # Check if new data is available in the source repository
          # This is a placeholder - implement actual logic based on your data source
          echo "should_train=true" >> $GITHUB_OUTPUT

  train-model:
    runs-on: ubuntu-latest
    needs: check-new-data
    if: needs.check-new-data.outputs.should_train == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync

      - name: Download latest data
        run: |
          # Download or update data from source
          uv run python -c "
          from match_predictor.data.data_loader import DataLoader
          loader = DataLoader('JeffSackmann/tennis_atp')
          matches = loader.load_matches()
          matches.to_pickle('data/matches_results.pkl')
          print(f'Downloaded {len(matches)} matches')
          "

      - name: Train model
        run: |
          uv run python -c "
          import pickle
          import pandas as pd
          from match_predictor.data.data_loader import DataLoader
          from match_predictor.ml_pipeline.training import ModelTrainer
          from config.model_config import ModelConfig

          # Load data
          with open('data/matches_results.pkl', 'rb') as f:
              matches = pickle.load(f)

          # Prepare ML dataset
          loader = DataLoader('JeffSackmann/tennis_atp')
          ml_data = loader.get_ml_data(df=matches)

          # Train model
          config = ModelConfig()
          trainer = ModelTrainer(config)
          metrics = trainer.train(
              ml_data,
              tune_hyperparameters=${{ github.event.inputs.tune_hyperparameters || false }},
              log_to_mlflow=True
          )

          print(f'Training complete. Test accuracy: {metrics[\"test_accuracy\"]:.4f}')

          # Save model
          trainer.save_model('models/latest_model.pkl')
          "

      - name: Evaluate and deploy model
        run: |
          uv run python -c "
          import pickle
          from pathlib import Path

          # Load new model
          with open('models/latest_model.pkl', 'rb') as f:
              new_model_data = pickle.load(f)

          new_accuracy = new_model_data['metrics']['test_accuracy']
          print(f'New model accuracy: {new_accuracy:.4f}')

          # Check if champion model exists
          champion_path = Path('models/champion_model.pkl')
          if champion_path.exists():
              with open(champion_path, 'rb') as f:
                  champion_data = pickle.load(f)
              champion_accuracy = champion_data['metrics']['test_accuracy']
              print(f'Champion model accuracy: {champion_accuracy:.4f}')
          else:
              champion_accuracy = None
              print('No champion model found')

          # Promote if better
          if champion_accuracy is None or new_accuracy > champion_accuracy:
              import shutil
              shutil.copy('models/latest_model.pkl', 'models/champion_model.pkl')
              print('✓ New model promoted to champion!')
          else:
              print('✗ New model not better than champion')
          "

      - name: Commit and push new model
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add models/champion_model.pkl || true
          git commit -m "Update champion model [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Create release on promotion
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: model-${{ github.run_number }}
          release_name: Model Training Run ${{ github.run_number }}
          body: |
            Automated model training completed successfully.
            
            Training metrics are available in MLflow.
          draft: false
          prerelease: false
