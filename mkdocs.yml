site_name: Tennis Match Predictor
site_description: ML-powered tennis match prediction system
site_author: Federico Raimondi Cominesi
repo_url: https://github.com/FedericoRaimondi/tennis-match-predictor
repo_name: tennis-match-predictor

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - Streamlit App: user-guide/streamlit-app.md
      - API Usage: user-guide/api-usage.md
      - Docker Deployment: user-guide/docker-deployment.md
  - ML Pipeline:
      - Feature Engineering: ml-pipeline/feature-engineering.md
      - Model Training: ml-pipeline/training.md
      - Hyperparameter Tuning: ml-pipeline/hyperparameter-tuning.md
      - Monitoring: ml-pipeline/monitoring.md
  - API Reference:
      - Data Module: api-reference/data.md
      - Model Module: api-reference/model.md
      - API Module: api-reference/api.md
      - ML Pipeline: api-reference/ml-pipeline.md
  - Contributing: contributing.md
  - License: license.md
